<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="depArrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#201a26" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="840" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="275" y="55" width="735" height="740" rx="10" fill="#ffffff" stroke="#663e72" stroke-width="2.5"/>
  <text x="642" y="90" text-anchor="middle" fill="#663e72" font-size="20" font-weight="700">Casa Inteligente</text>

  <!-- ===== Associations (solid) ===== -->
  <g stroke="#201a26" stroke-width="1.4">
    <!-- Morador para 6 casos de uso -->
    <line x1="122" y1="381" x2="315" y2="135"/>
    <line x1="122" y1="381" x2="315" y2="255"/>
    <line x1="122" y1="381" x2="315" y2="375"/>
    <line x1="122" y1="381" x2="315" y2="495"/>
    <line x1="122" y1="381" x2="315" y2="615"/>
    <line x1="122" y1="381" x2="315" y2="735"/>
    <!-- ESP8266 para 2 casos de uso -->
    <line x1="1161" y1="466" x2="955" y2="360"/>
    <line x1="1161" y1="466" x2="955" y2="560"/>
  </g>

  <!-- ===== Dependencies (dashed) ===== -->
  <g stroke="#201a26" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#depArrow)">
    <!-- extend: "Acionar dispositivo por voz" estende "Acionar dispositivo" -->
    <line x1="455" y1="458" x2="455" y2="412"/>
    <!-- include: "Acionar dispositivo" inclui "Autenticar-se" -->
    <path d="M 585 356 Q 700 255 583 150"/>
  </g>
  <text x="470" y="440" font-size="13" font-style="italic" fill="#201a26">&#171;extend&#187;</text>
  <text x="660" y="250" font-size="13" font-style="italic" fill="#201a26">&#171;include&#187;</text>

  <!-- ===== Actor: Morador ===== -->
  <g stroke="#663e72" stroke-width="2.5" fill="none">
    <circle cx="95" cy="345" r="17"/>
    <line x1="95" y1="362" x2="95" y2="415"/>
    <line x1="68" y1="381" x2="122" y2="381"/>
    <line x1="95" y1="415" x2="74" y2="450"/>
    <line x1="95" y1="415" x2="116" y2="450"/>
  </g>
  <text x="95" y="478" text-anchor="middle">
    <tspan font-size="15" font-weight="700" fill="#663e72">Morador</tspan>
    <tspan x="95" dy="18" font-size="12" fill="#201a26">(idoso / pessoa com</tspan>
    <tspan x="95" dy="15" font-size="12" fill="#201a26">mobilidade reduzida)</tspan>
  </text>

  <!-- ===== Actor: Controlador Fisico ===== -->
  <g stroke="#663e72" stroke-width="2.5" fill="none">
    <circle cx="1190" cy="430" r="17"/>
    <line x1="1190" y1="447" x2="1190" y2="500"/>
    <line x1="1163" y1="466" x2="1217" y2="466"/>
    <line x1="1190" y1="500" x2="1169" y2="535"/>
    <line x1="1190" y1="500" x2="1211" y2="535"/>
  </g>
  <text x="1190" y="563" text-anchor="middle">
    <tspan font-size="14" font-weight="700" fill="#663e72">Controlador Físico</tspan>
    <tspan x="1190" dy="17" font-size="12" fill="#201a26">(ESP8266)</tspan>
  </text>

  <!-- ===== Use cases: Morador ===== -->
  <g fill="#ffffff" stroke="#201a26" stroke-width="1.6">
    <ellipse cx="455" cy="135" rx="140" ry="35"/>
    <ellipse cx="455" cy="255" rx="140" ry="35"/>
    <ellipse cx="455" cy="375" rx="140" ry="35"/>
    <ellipse cx="455" cy="495" rx="140" ry="35"/>
    <ellipse cx="455" cy="615" rx="140" ry="35"/>
    <ellipse cx="455" cy="735" rx="140" ry="35"/>
  </g>
  <g fill="#201a26" font-size="14.5" text-anchor="middle">
    <text x="455" y="140">Autenticar-se</text>
    <text x="455" y="255"><tspan x="455" dy="-6">Configurar perfil</tspan><tspan x="455" dy="17">de acessibilidade</tspan></text>
    <text x="455" y="380">Acionar dispositivo</text>
    <text x="455" y="495"><tspan x="455" dy="-6">Acionar dispositivo</tspan><tspan x="455" dy="17">por voz</tspan></text>
    <text x="455" y="620">Criar / editar automação</text>
    <text x="455" y="735"><tspan x="455" dy="-6">Consultar histórico</tspan><tspan x="455" dy="17">de acionamentos</tspan></text>
  </g>

  <!-- ===== Use cases: ESP8266 ===== -->
  <g fill="#ffffff" stroke="#201a26" stroke-width="1.6">
    <ellipse cx="820" cy="360" rx="135" ry="35"/>
    <ellipse cx="820" cy="560" rx="135" ry="35"/>
  </g>
  <g fill="#201a26" font-size="14.5" text-anchor="middle">
    <text x="820" y="360"><tspan x="820" dy="-6">Sincronizar estado</tspan><tspan x="820" dy="17">dos dispositivos</tspan></text>
    <text x="820" y="560"><tspan x="820" dy="-6">Enviar leituras</tspan><tspan x="820" dy="17">dos sensores</tspan></text>
  </g>

  <!-- caption -->
  <text x="40" y="822" font-size="12" fill="#5b5361">Diagrama de Casos de Uso &#183; Casa Inteligente</text>
</svg>
