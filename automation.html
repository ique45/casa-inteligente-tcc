<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casa Inteligente — Automações</title>
  <script>
    /* Le a preferencia antes do CSS carregar, para a tela nao piscar no tema
       errado. Curto de proposito: um arquivo externo reintroduziria o piscar. */
    (function () {
      var t = localStorage.getItem('ci-theme');
      var s = localStorage.getItem('ci-textsize');
      if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      if (s && s !== 'normal') document.documentElement.setAttribute('data-textsize', s);
    })();
  </script>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    .automations-list { display: flex; flex-direction: column; gap: 0.625rem; margin-bottom: 1.75rem; }
    .form-card {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .form-step { margin-bottom: 1.25rem; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conte&uacute;do</a>

  <div class="a11y-bar">
    <div class="a11y-group" role="group" aria-label="Tamanho do texto">
      <span class="a11y-group-label">Tamanho do texto:</span>
      <button type="button" class="a11y-size" data-size="normal" aria-pressed="true" title="Texto normal">A</button>
      <button type="button" class="a11y-size" data-size="grande" aria-pressed="false" title="Texto grande">A</button>
      <button type="button" class="a11y-size" data-size="maior" aria-pressed="false" title="Texto muito grande">A</button>
    </div>

    <button type="button" class="a11y-theme" id="btn-theme">
      <span aria-hidden="true">&#127769;</span> <span id="btn-theme-label">Tema escuro</span>
    </button>

    <span id="a11y-live" class="visually-hidden" aria-live="polite"></span>
  </div>
  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-dot"></div>
        <span class="sidebar-logo-text">CASA<br>INTELIGENTE</span>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-item" id="btn-dashboard">
          <span class="sidebar-item-icon">🏠</span><span>Dashboard</span>
        </a>
        <a href="automation.html" class="sidebar-item active" id="btn-automations">
          <span class="sidebar-item-icon">⚡</span><span>Automações</span>
        </a>
        <a href="history.html" class="sidebar-item" id="btn-history-page">
          <span class="sidebar-item-icon">📋</span><span>Histórico</span>
        </a>
        <a href="profile.html" class="sidebar-item" id="btn-profile">
          <span class="sidebar-item-icon">👤</span><span>Perfil</span>
        </a>
        <button class="sidebar-item sidebar-item-danger" id="btn-logout">
          <span class="sidebar-item-icon">🚪</span><span>Sair</span>
        </button>
      </div>
    </nav>

    <main class="page-body" id="conteudo">
      <div class="section-header">
        <div>
          <h2 class="section-title" style="margin:0">Minhas automações</h2>
          <p class="section-subtitle" style="margin:0.25rem 0 0">Regras automáticas para seus dispositivos</p>
        </div>
        <button class="btn btn-primary" id="btn-new-auto">+ Nova automação</button>
      </div>

      <div class="automations-list" id="automations-list">
        <div class="empty-msg">Nenhuma automação cadastrada ainda.</div>
      </div>

      <div id="form-wrap" style="display:none">
        <div class="form-card">
          <div class="form-step">
            <div class="step-label"><span class="step-num">1</span> Dispositivo</div>
            <div class="chip-group" id="device-chips"></div>
          </div>

          <div class="form-step" id="step-name" style="display:none">
            <div class="form-group" style="margin:0">
              <label class="form-label" for="input-name">
                <span class="step-num">2</span> Nome
                <button type="button" class="tooltip-icon" aria-expanded="false"><span aria-hidden="true">ⓘ</span><span class="visually-hidden">Ajuda</span><span class="tooltip-text">Nome para identificar essa automação. Aparece no histórico. Ex: "Luz Cozinha".</span></button>
              </label>
              <input type="text" id="input-name" class="form-input" placeholder="Ex: Luz Cozinha" maxlength="40"/>
            </div>
          </div>

          <div class="form-step" id="step-trigger" style="display:none">
            <div class="step-label">
              <span class="step-num">3</span> Gatilho
              <button type="button" class="tooltip-icon" aria-expanded="false"><span aria-hidden="true">ⓘ</span><span class="visually-hidden">Ajuda</span><span class="tooltip-text">O que vai acionar essa automação: sua voz, um botão no site, sensor de presença, temperatura ou horário programado.</span></button>
            </div>
            <div class="chip-group" id="trigger-chips"></div>
          </div>

          <div class="form-step" id="step-voice" style="display:none">
            <div class="form-group" style="margin:0">
              <label class="form-label" for="input-voice">
                <span class="step-num">4</span> Comando de voz
                <button type="button" class="tooltip-icon" aria-expanded="false"><span aria-hidden="true">ⓘ</span><span class="visually-hidden">Ajuda</span><span class="tooltip-text">A frase exata que você vai falar para ativar essa automação.</span></button>
              </label>
              <div class="chip-group" id="voice-suggestions" style="margin-bottom:0.625rem"></div>
              <input type="text" id="input-voice" class="form-input" placeholder="Ex: Ligar luz da sala" maxlength="60"/>
            </div>
          </div>

          <div class="form-step" id="step-action" style="display:none">
            <div class="step-label"><span class="step-num" id="action-step-num">5</span> Ação</div>
            <div class="chip-group" id="action-chips"></div>
          </div>

          <div id="preview-wrap" style="display:none">
            <div class="preview-label">Como vai funcionar:</div>
            <div class="preview-box" id="preview-box">—</div>
          </div>

          <p id="auto-error-msg" class="error-msg" style="display:none;margin-top:0.75rem"></p>
          <button class="btn btn-primary" id="btn-save-auto" style="display:none;margin-top:1rem">Salvar automação</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/devices.js"></script>
  <script src="js/automation.js"></script>
</body>
</html>
