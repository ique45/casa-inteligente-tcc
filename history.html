<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casa Inteligente — Histórico</title>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    .filters { display: flex; flex-direction: column; gap: 0.625rem; margin-bottom: 1.5rem; }
    .filter-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .filter-label { font-size: var(--fs-sm); font-weight: 700; letter-spacing: 1px; color: var(--text-muted); min-width: 5rem; text-transform: uppercase; }
    .history-table { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn-load-more { width: 100%; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-dot"></div>
        <span class="sidebar-logo-text">CASA<br>INTELIGENTE</span>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-item" id="btn-dashboard">
          <span class="sidebar-item-icon">🏠</span><span>Dashboard</span>
        </a>
        <a href="automation.html" class="sidebar-item" id="btn-automations">
          <span class="sidebar-item-icon">⚡</span><span>Automações</span>
        </a>
        <a href="history.html" class="sidebar-item active" id="btn-history-page">
          <span class="sidebar-item-icon">📋</span><span>Histórico</span>
        </a>
        <a href="profile.html" class="sidebar-item" id="btn-profile">
          <span class="sidebar-item-icon">👤</span><span>Perfil</span>
        </a>
        <button class="sidebar-item sidebar-item-danger" id="btn-logout">
          <span class="sidebar-item-icon">🚪</span><span>Sair</span>
        </button>
      </div>
    </nav>

    <div class="page-body">
      <h2 class="section-title">Histórico de ativações</h2>
      <p class="section-subtitle">Tudo que aconteceu nos seus dispositivos</p>

      <div class="filters">
        <div class="filter-row">
          <span class="filter-label">Gatilho</span>
          <button type="button" class="filter-chip active" data-filter="trigger" data-value="todos" aria-pressed="true">Todos</button>
          <button type="button" class="filter-chip" data-filter="trigger" data-value="voz" aria-pressed="false">🎤 Voz</button>
          <button type="button" class="filter-chip" data-filter="trigger" data-value="botao" aria-pressed="false">🔘 Botão</button>
          <button type="button" class="filter-chip" data-filter="trigger" data-value="presenca" aria-pressed="false">👁️ Presença</button>
          <button type="button" class="filter-chip" data-filter="trigger" data-value="horario" aria-pressed="false">⏰ Horário</button>
          <button type="button" class="filter-chip" data-filter="trigger" data-value="temperatura" aria-pressed="false">🌡️ Temperatura</button>
        </div>
        <div class="filter-row">
          <span class="filter-label">Período</span>
          <button type="button" class="filter-chip active" data-filter="period" data-value="todos" aria-pressed="true">Todos os dias</button>
          <button type="button" class="filter-chip" data-filter="period" data-value="hoje" aria-pressed="false">Hoje</button>
          <button type="button" class="filter-chip" data-filter="period" data-value="7dias" aria-pressed="false">7 dias</button>
          <button type="button" class="filter-chip" data-filter="period" data-value="30dias" aria-pressed="false">30 dias</button>
        </div>
      </div>

      <div class="history-table" id="history-table">
        <div class="empty-msg">Carregando...</div>
      </div>

      <button class="btn btn-secondary btn-load-more" id="btn-load-more" style="display:none">
        Carregar mais registros
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/devices.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
