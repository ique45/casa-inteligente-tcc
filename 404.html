<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casa Inteligente — Página não encontrada</title>
  <script>
    /* Le a preferencia antes do CSS carregar, para a tela nao piscar no tema
       errado. Curto de proposito: um arquivo externo reintroduziria o piscar. */
    (function () {
      var t = localStorage.getItem('ci-theme');
      var s = localStorage.getItem('ci-textsize');
      if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      if (s && s !== 'normal') document.documentElement.setAttribute('data-textsize', s);
    })();
  </script>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    .error-container {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
    }
    .error-card {
      width: 100%; max-width: 28rem; text-align: center;
    }
    .error-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 4.5rem; height: 4.5rem;
      background: var(--accent-weak); border: 2px solid var(--accent);
      border-radius: 16px; font-size: var(--fs-2xl); margin-bottom: 1.25rem;
    }
    .error-code {
      display: block; font-size: var(--fs-sm); font-weight: 700;
      letter-spacing: 2px; color: var(--accent-text); margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: var(--fs-2xl); font-weight: 800; color: var(--text);
      margin-bottom: 0.75rem;
    }
    .error-text {
      font-size: var(--fs-base); color: var(--text-muted);
      margin-bottom: 2rem; line-height: 1.6;
    }
    .error-actions {
      display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conte&uacute;do</a>

  <div class="a11y-bar">
    <div class="a11y-group" role="group" aria-label="Tamanho do texto">
      <span class="a11y-group-label">Tamanho do texto:</span>
      <button type="button" class="a11y-size" data-size="normal" aria-pressed="true" title="Texto normal">A</button>
      <button type="button" class="a11y-size" data-size="grande" aria-pressed="false" title="Texto grande">A</button>
      <button type="button" class="a11y-size" data-size="maior" aria-pressed="false" title="Texto muito grande">A</button>
    </div>

    <button type="button" class="a11y-theme" id="btn-theme">
      <span aria-hidden="true">&#127769;</span> <span id="btn-theme-label">Tema escuro</span>
    </button>

    <span id="a11y-live" class="visually-hidden" aria-live="polite"></span>
  </div>

  <main class="error-container" id="conteudo">
    <div class="error-card">
      <div class="error-icon" aria-hidden="true">🏠</div>
      <span class="error-code">ERRO 404</span>
      <h1 class="error-title">Página não encontrada</h1>
      <p class="error-text">
        O endereço que você tentou abrir não existe ou foi movido. Confira o
        link, ou volte para uma das páginas abaixo.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Voltar para o início</a>
        <a href="dashboard.html" class="btn btn-secondary">Ir para o Dashboard</a>
      </div>
    </div>
  </main>

  <script src="js/a11y.js"></script>
</body>
</html>
